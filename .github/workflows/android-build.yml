name: Build Chapter Ledger

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/chapter-ledger-upload.jks"
          test -s "${{ github.workspace }}/chapter-ledger-upload.jks"

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/chapter-ledger-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: chapter-ledger-release
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Remove signing keystore
        if: always()
        run: rm -f "${{ github.workspace }}/chapter-ledger-upload.jks"
